name: Apply to Approved Tier 1 Jobs

on:
  schedule:
    - cron: '0 11 * * *'   # Daily at 11:00 AM UTC (2h after scrape for review)
  workflow_dispatch:        # Manual trigger

jobs:
  apply-tier1:
    runs-on: ubuntu-latest
    permissions:
      contents: write      # for committing state files back
      issues: write        # for closing Issues with outcome

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Install Playwright browsers
        run: playwright install --with-deps chromium

      - name: Apply to approved jobs
        run: python run_pipeline.py apply-tier1 --burn-in
        env:
          GROQ_API_KEY: ${{ secrets.GROQ_API_KEY }}
          GOOGLE_AI_API_KEY: ${{ secrets.GOOGLE_AI_API_KEY }}
          APIFY_TOKEN: ${{ secrets.APIFY_TOKEN }}
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Commit updated state files
        uses: stefanzweifel/git-auto-commit-action@v5
        with:
          commit_message: "chore: update job state after apply run"
          file_pattern: 'data/jobs_seen.json'
